services:
  lightinator-log-service:
    image: lightinator-log-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - LLS_HTTP_HOST=0.0.0.0
      - LLS_HTTP_PORT=4821
      - LLS_UDP_HOST=0.0.0.0
      - LLS_UDP_PORT=5514
      - LLS_DATA_DIR=/app/data/logs
      - LLS_MAX_BYTES_PER_IP=20971520
      - LLS_RETENTION_DAYS=7
      - LLS_SERVICE_NAME=LightinatorLogService
      - LLS_MDNS_HOST=lightinator-logservice.local
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4
    profiles: [monitoring]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-local.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
