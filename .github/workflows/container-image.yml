name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - prod
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - develop
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        env:
          # Dummy-Schlüssel für Tests, damit der Client im Testmodus initialisiert werden kann
          GEMINI_API_KEY: "test-dummy-key"
        run: npm run test:ci

      - name: Summarize Node test results
        if: ${{ !cancelled() && hashFiles('test-results/node.xml') != '' }}
        run: node scripts/report-tests.js test-results/node.xml "Node.js ${{ matrix.node }} tests"

      - name: Upload Node test reports
        if: ${{ !cancelled() && hashFiles('test-results/node.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: node-test-results-${{ matrix.node }}
          path: test-results/node.xml
          retention-days: 14

      - name: Publish Node test check
        if: ${{ !cancelled() && hashFiles('test-results/node.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: Node.js ${{ matrix.node }} test results
          path: test-results/node.xml
          reporter: java-junit
          use-actions-summary: 'false'
          fail-on-error: 'false'
          fail-on-empty: 'true'

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Summarize browser test results
        if: ${{ !cancelled() && hashFiles('test-results/playwright.xml') != '' }}
        run: node scripts/report-tests.js test-results/playwright.xml "Playwright browser tests"

      - name: Upload browser reports and failure artifacts
        if: ${{ !cancelled() && hashFiles('test-results/playwright.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Publish browser test check
        if: ${{ !cancelled() && hashFiles('test-results/playwright.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        continue-on-error: true
        with:
          name: Playwright browser test results
          path: test-results/playwright.xml
          reporter: jest-junit
          use-actions-summary: 'false'
          fail-on-error: 'false'
          fail-on-empty: 'true'

  build:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + build/* tags for the changelog

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate changelog (src/changelog.json)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_VERSION: ${{ github.ref_name }}-${{ steps.sha.outputs.short }}
        run: npm run changelog

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Build (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ github.ref_name }}-${{ steps.sha.outputs.short }}
            BUILD_NUMBER=${{ github.run_number }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_VERSION=${{ github.ref_name }}-${{ steps.sha.outputs.short }}
            BUILD_NUMBER=${{ github.run_number }}

      # Marks the built commit so later changelogs know what shipped in this build.
      # `on.push.tags` only matches v*, so pushing build/* does not retrigger CI.
      - name: Tag commit as build/${{ github.run_number }}
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "build/${{ github.run_number }}"
          git push origin "build/${{ github.run_number }}"